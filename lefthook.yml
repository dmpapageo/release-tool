pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks git --pre-commit --staged --redact
    dart-format:
      glob: "*.dart"
      run: dart format --set-exit-if-changed {staged_files}
    dart-analyze:
      glob: "*.dart"
      run: dart analyze --fatal-infos {staged_files}

pre-push:
  commands:
    test:
      run: dart test
